# Site configuration. Restart `jekyll serve` after a change to this file.

# Theme: Minimal Mistakes. Files in this repository override the theme files with the same path.
remote_theme             : "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin    : "default"

# Site settings
locale                   : "en-US"
title                    : "CNVPathwayAtlas"
title_separator          : "-"
name                     : "CNVPathwayAtlas"
description              : "Curated rare copy number variants (CNVs) linked to Orphanet disorders, HPO phenotypes, HGNC genes and WikiPathways molecular pathways."
url                      : "https://cnvpathwayatlas.github.io"
baseurl                  : "/cnv-website"
repository               : "CNVPathwayAtlas/cnv-website"
data_repository          : "CNVPathwayAtlas/cnv-data"
logo                     : "/assets/images/CNVPathwayAtlas_logo.png"
og_image                 : "/assets/images/CNVPathwayAtlas_logo.png"
masthead_title           : "Home"
words_per_minute         : 200

# Site search (lunr). assets/js/lunr/lunr-store.js adds the CNV data to the index.
search                   : true
search_full_content      : false
search_provider          : lunr

atom_feed:
  hide                   : true

social:
  type                   : Organization
  name                   : "CNVPathwayAtlas"

# Reading files
include:
  - _pages
exclude:
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Gemfile
  - Gemfile.lock
  - IMPROVEMENTS.md
  - LICENSE
  - node_modules
  - package.json
  - Rakefile
  - README.md
  - scripts
  - cnv-data
keep_files:
  - .git

# Conversion
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"
markdown                 : kramdown
highlighter              : rouge
excerpt_separator        : "\n\n"
kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
sass:
  sass_dir               : _sass
  style                  : compressed

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-include-cache

# HTML compression
compress_html:
  clippings              : all
  ignore:
    envs                 : development

# Defaults
defaults:
  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: cnvs
    values:
      layout: cnv-page

collections:
  cnvs:
    output: true
    permalink: /cnv/:name/
